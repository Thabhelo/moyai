name: CI
on: [push, pull_request]

# Deploys are done by Cloudflare: the Worker is connected to this repository,
# so every push to main is built and published to moyai.fyi from there.
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
